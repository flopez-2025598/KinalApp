spring.application.name=KinalRestApplication

#Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/KinalApp?createDatabaseIfNotExist=true
spring.datasource.username=ByronAquino
spring.datasource.password=administrador
server.port=8021

#JPA / hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Ejecutar scripts SQL de inicializacion para asegurar AUTO_INCREMENT en tablas existentes
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# Usar la estrategia física estándar para respetar los nombres exactos de las tablas creadas manualmente
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl